<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Carrinho de compras — JOGOS SENAI">
  <title>Carrinho de Compras — JOGOS SENAI</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="carrinho.css">
</head>
<body>

  <!-- ════════ HEADER ════════ -->
  <header class="header" id="header">
    <div class="header__inner container">
      <a href="index.html" class="header__logo" aria-label="Página inicial">
        JOGOS <span class="header__logo-accent">SENAI</span>
      </a>
      <nav class="header__nav" id="main-nav" aria-label="Navegação principal">
        <ul class="header__links">
          <li><a href="index.html" class="header__link">Home</a></li>
          <li><a href="integrantes.html" class="header__link">Integrantes</a></li>
          <li>
            <a href="carrinho.html" class="header__link header__link--active">
              Carrinho
              <span class="header__badge" id="cart-count" aria-label="Itens no carrinho"></span>
            </a>
          </li>
        </ul>
      </nav>
      <button class="header__toggle" id="nav-toggle" aria-label="Abrir menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- ════════ MAIN ════════ -->
  <main class="page-body">
    <div class="container">
      <h2 class="section-title">Seu Carrinho</h2>

      <div class="cart-panel reveal">
        <!-- Empty state (shown/hidden by JS) -->
        <div class="cart-empty" id="cart-empty" style="display:none">
          <div class="cart-empty__icon">🛒</div>
          <p class="cart-empty__text">Seu carrinho está vazio</p>
          <a href="index.html" class="btn btn--primary">Explorar Jogos</a>
        </div>

        <!-- Cart table (shown when items exist) -->
        <div id="cart-content">
          <table class="cart-table" aria-label="Itens do carrinho">
            <thead>
              <tr>
                <th>Produto</th>
                <th>Preço</th>
                <th>Quantidade</th>
                <th>Total</th>
                <th>Ação</th>
              </tr>
            </thead>
            <tbody id="cart-items"></tbody>
          </table>

          <div class="cart-summary">
            <div class="cart-summary__row">
              <span class="cart-summary__label">Total</span>
              <strong class="cart-summary__total" id="cart-total">R$ 0,00</strong>
            </div>
            <div class="cart-summary__actions">
              <a class="btn btn--ghost" href="index.html">Continuar Comprando</a>
              <button class="btn btn--secondary" id="checkout-btn">Finalizar Compra</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- ════════ FOOTER ════════ -->
  <footer class="footer">
    <div class="container">
      <p class="footer__text">© 2026 Jogos SENAI — Todos os direitos reservados</p>
      <p class="footer__credit">Desenvolvido por Davi, Renan e Kauan</p>
    </div>
  </footer>

  <script src="carrinho.js"></script>
  <script src="animations.js"></script>
</body>
</html>
